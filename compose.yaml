name: ai-assisted-log

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    image: ai-assisted-log-api
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/log_api
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (o scripts/up.sh gera um)}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
